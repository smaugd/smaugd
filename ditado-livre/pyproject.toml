[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ditado-livre"
version = "0.1.0"
description = "Ditado por voz gratuito para Windows: segure um atalho, fale e o texto aparece no cursor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.1,<2",
    "numpy",
    "sounddevice>=0.4",
    "pynput>=1.7",
    "pyperclip>=1.8",
    "pystray>=0.19",
    "pillow",
    "httpx>=0.27",
    "sv-ttk>=2.6",
]

[project.optional-dependencies]
# Bibliotecas CUDA 12 / cuDNN 9 exigidas pelo ctranslate2 (motor do faster-whisper) na GPU NVIDIA.
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12==9.*"]
dev = ["pytest>=8"]

[project.scripts]
ditado-livre = "ditado_livre.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
